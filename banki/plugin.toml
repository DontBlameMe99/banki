id = "dontblameme/banki"
name = "Banki"
version = "0.4.1"
plugin_api = 56
author = "DontBlameMe"
license = "GPL-3.0-or-later"
description = "Anki due-card count with daily totals for the Noctalia bar."
tags = ["bar", "utility"]
icon = "sparkles"
dependencies = []


  [[setting]]
key = "sync_enabled"
label_key = "settings.sync_enabled.label"
description_key = "settings.sync_enabled.description"
type = "bool"
default = false


  [[setting]]
key = "sync_key"
label_key = "settings.sync_key.label"
description_key = "settings.sync_key.description"
advanced = true
secret = true
type = "string"
default = ""


  [[setting]]
key = "sync_key_file"
label_key = "settings.sync_key_file.label"
description_key = "settings.sync_key_file.description"
advanced = true
type = "file"
default = ""
extensions = []


  [[setting]]
key = "collection_path"
label_key = "settings.collection_path.label"
description_key = "settings.collection_path.description"
type = "string"
default = ""


  [[setting]]
key = "refresh_seconds"
label_key = "settings.refresh_seconds.label"
description_key = "settings.refresh_seconds.description"
type = "int"
default = 600
min = 5
max = 1195


  [[setting]]
key = "include_new"
label_key = "settings.include_new.label"
description_key = "settings.include_new.description"
advanced = true
type = "bool"
default = false

[[widget]]
id = "banki"
entry = "bar.luau"
[widget.actions]
left = "exec anki"

  [[widget.setting]]
key = "hide_icon"
label_key = "settings.hide_icon.label"
type = "bool"
default = false

  [[widget.setting]]
key = "hide_text"
label_key = "settings.hide_text.label"
type = "bool"
default = false

  [[widget.setting]]
key = "hide_on_complete"
label_key = "settings.hide_on_complete.label"
type = "bool"
default = false

  [[widget.setting]]
key = "follow_accent"
label_key = "settings.follow_accent.label"
description_key = "settings.follow_accent.description"
type = "bool"
default = true
