name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Plugin manifest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate plugin manifest
        uses: noctalia-dev/official-plugins/.github/actions/validate-plugins@5dc1d19b1aa6be331ee6506034dc8448aca5c446 # main
        with:
          profile: community
          root: ${{ github.workspace }}

  rust:
    name: Rust and generated plugin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: x86_64-unknown-linux-musl

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install --yes musl-tools

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Check generated plugin matches
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: |
          cargo build --release --target x86_64-unknown-linux-musl
          python3 .github/scripts/emit.py target/x86_64-unknown-linux-musl/release/banki-helper
          # The committed helper is rebuilt by the release and bump workflows.
          # CI cannot compare it byte-for-byte because local and runner
          # toolchains produce different binaries.
          git diff --exit-code -- \
            banki/plugin.toml \
            banki/bar.luau \
            banki/lib/bridge.luau \
            banki/translations/en.json \
            banki/assets/anki.svg \
            banki/sync.py \
            banki/LICENSE

      - name: Check the helper is static
        run: |
          helper=target/x86_64-unknown-linux-musl/release/banki-helper
          if readelf -l "$helper" | grep -q INTERP; then
            echo "$helper has a dynamic interpreter" >&2
            exit 1
          fi
          if readelf -d "$helper" | grep -q NEEDED; then
            echo "$helper has dynamic dependencies" >&2
            exit 1
          fi

      - name: Check the catalog matches the manifest
        run: python3 .github/scripts/check-catalog.py

      - name: Install luau-lsp
        env:
          LUAU_LSP_VERSION: "1.70.1"
        run: |
          curl -fsSL -o "$RUNNER_TEMP/luau-lsp.zip" \
            "https://github.com/JohnnyMorganz/luau-lsp/releases/download/$LUAU_LSP_VERSION/luau-lsp-linux-x86_64.zip"
          unzip -q "$RUNNER_TEMP/luau-lsp.zip" -d "$RUNNER_TEMP/luau-lsp"
          echo "$RUNNER_TEMP/luau-lsp" >> "$GITHUB_PATH"

      - name: Fetch the Noctalia API definitions
        env:
          DEFINITIONS_COMMIT: 5dc1d19b1aa6be331ee6506034dc8448aca5c446
        run: |
          curl -fsSL -o "$RUNNER_TEMP/noctalia.d.luau" \
            "https://raw.githubusercontent.com/noctalia-dev/official-plugins/$DEFINITIONS_COMMIT/noctalia.d.luau"

      - name: Analyze Luau
        run: luau-lsp analyze --definitions="$RUNNER_TEMP/noctalia.d.luau" --ignore 'banki/lib/bridge.luau' banki
