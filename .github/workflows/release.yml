name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version component to bump
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: x86_64-unknown-linux-musl

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install --yes musl-tools

      - name: Bump the version
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          version="$(python3 .github/scripts/bump-version.py "$BUMP")"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "release v$version already exists" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build the helper
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Emit the plugin
        run: |
          python3 .github/scripts/emit.py target/x86_64-unknown-linux-musl/release/banki-helper
          mv -f target/x86_64-unknown-linux-musl/release/banki-helper banki/banki-helper
          if readelf -l banki/banki-helper | grep -q INTERP; then
            echo "banki/banki-helper has a dynamic interpreter" >&2
            exit 1
          fi
          if readelf -d banki/banki-helper | grep -q NEEDED; then
            echo "banki/banki-helper has dynamic dependencies" >&2
            exit 1
          fi

      - name: Check
        run: |
          cargo fmt --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace

      - name: Validate plugin manifest
        uses: noctalia-dev/official-plugins/.github/actions/validate-plugins@5dc1d19b1aa6be331ee6506034dc8448aca5c446 # main
        with:
          profile: community
          root: ${{ github.workspace }}

      - name: Check the catalog
        run: python3 .github/scripts/check-catalog.py

      - name: Push the version bump to main
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock catalog.toml banki
          git commit --message "chore: bump version to $VERSION"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:main"

      - name: Create the GitHub release
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --generate-notes \
            --target "$(git rev-parse HEAD)"
