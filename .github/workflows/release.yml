name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version component to bump
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.BANKI_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - name: Check BANKI_TOKEN
        env:
          BANKI_TOKEN: ${{ secrets.BANKI_TOKEN }}
        run: |
          if [ -z "$BANKI_TOKEN" ]; then
            echo "BANKI_TOKEN is required: the main ruleset cannot merge an Actions-app pull request" >&2
            exit 1
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: x86_64-unknown-linux-musl

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install --yes musl-tools

      - name: Bump the version
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          version="$(python3 .github/scripts/bump-version.py "$BUMP")"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "release v$version already exists" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build the helper
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Emit the plugin
        run: |
          python3 .github/scripts/emit.py target/x86_64-unknown-linux-musl/release/banki-helper
          mv -f target/x86_64-unknown-linux-musl/release/banki-helper banki/banki-helper
          if readelf -l banki/banki-helper | grep -q INTERP; then
            echo "banki/banki-helper has a dynamic interpreter" >&2
            exit 1
          fi
          if readelf -d banki/banki-helper | grep -q NEEDED; then
            echo "banki/banki-helper has dynamic dependencies" >&2
            exit 1
          fi

      - name: Check
        run: |
          cargo fmt --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace

      - name: Validate plugin manifest
        uses: noctalia-dev/official-plugins/.github/actions/validate-plugins@5dc1d19b1aa6be331ee6506034dc8448aca5c446 # main
        with:
          profile: community
          root: ${{ github.workspace }}

      - name: Check the catalog
        run: python3 .github/scripts/check-catalog.py

      - name: Land the version bump
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail
          branch="release/v$VERSION"
          git config user.name "DontBlameMe"
          git config user.email "contact@dontblameme.dev"
          git switch -c "$branch"
          git add Cargo.toml Cargo.lock catalog.toml banki
          git commit --message "chore: bump version to $VERSION"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:$branch"
          number="$(gh pr list --head "$branch" --json number --jq '.[0].number // empty')"
          if [ -z "$number" ]; then
            url="$(gh pr create --base main --head "$branch" \
              --title "chore: bump version to $VERSION" \
              --body "Bump the plugin version to $VERSION. The static helper and generated plugin were rebuilt and checked by the release workflow.")"
            number="${url##*/}"
            case "$number" in
              ''|*[!0-9]*)
                echo "could not parse pull request number from $url" >&2
                exit 1
                ;;
            esac
          fi
          for _ in 1 2 3 4 5; do
            if gh pr merge "$number" --squash --delete-branch; then
              exit 0
            fi
            sleep 5
          done
          state="$(gh pr view "$number" --json state --jq .state)"
          if [ "$state" = "MERGED" ]; then
            exit 0
          fi
          gh pr view "$number" --json state,mergeStateStatus >&2 || true
          exit 1

      - name: Create the GitHub release
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git fetch origin main
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --generate-notes \
            --target "$(git rev-parse FETCH_HEAD)"
