[package]
name = "banki"
version = "0.4.1"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/DontBlameMeDev/banki"
description = "Anki due-card count with daily totals for the Noctalia bar."
publish = false

[[bin]]
name = "banki-helper"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.41", default-features = false, features = ["clock"] }
noctalia-rs = "0.4"
rusqlite = { version = "0.38", features = ["bundled"] }
serde_json = "1"

[build-dependencies]
noctalia-rs-build = "0.4"

[lints.rust]
unsafe_code = "deny"
unused_imports = "deny"
unused_variables = "deny"
unused_mut = "deny"
dead_code = "deny"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
missing_panics_doc = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
shadow_reuse = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
undocumented_unsafe_blocks = "deny"
indexing_slicing = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_possible_wrap = "deny"
cast_precision_loss = "deny"
arithmetic_side_effects = "deny"
multiple_unsafe_ops_per_block = "deny"
wildcard_imports = "deny"
enum_glob_use = "deny"
unused_result_ok = "deny"
absolute_paths = "deny"
allow_attributes = "deny"
unsafe_derive_deserialize = "deny"
cast_ptr_alignment = "deny"
result_unit_err = "deny"
or_fun_call = "deny"
expect_fun_call = "deny"
cast_lossless = "deny"
vec_resize_to_zero = "deny"
clone_on_ref_ptr = "deny"
rc_buffer = "deny"
arc_with_non_send_sync = "deny"
wildcard_enum_match_arm = "deny"
match_same_arms = "deny"
single_match_else = "deny"
missing_const_for_fn = "deny"
redundant_pub_crate = "deny"
option_if_let_else = "deny"
needless_pass_by_ref_mut = "deny"
integer_division = "deny"
use_self = "deny"
redundant_clone = "deny"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
strip = true
